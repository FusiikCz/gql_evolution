x-services-volume:
  &system-data-volume
  type: bind
  source: ./systemdata.rnd.json
  target: /app/systemdata.json


services:

  chatgpt-web:
    image: yidadaa/chatgpt-next-web
    environment:
      OPENAI_API_KEY: <Azure OpenAI API Key>
      BASE_URL: http://azure_proxy:8000
      CODE: ""
      HIDE_USER_API_KEY: 1
      HIDE_BALANCE_QUERY: 1
      ENABLE_MCP: "true"
    ports:
      - 3000:3000

  gql_app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: data
      POSTGRES_HOST: postgres_gql:5432
      DEMODATA: "True"
      DISABLE_WHOAMI_EXTENSION: "False"
    depends_on:
      - postgres_gql
    ports:
      - 8000:8000
      # Port 4000 so that http://localhost:4000/api/gql and http://localhost:4000/gql work (same app as 8000)
      - 4000:8000
    volumes:
      - ./:/app

  # Apollo Federation Gateway - uses hrbolek/apollo_federation
  # This router uses environment variables instead of supergraph files
  # Note: gql_app is also exposed on 4000 so http://localhost:4000/api/gql works; Apollo is on 4001
  apollo:
    image: hrbolek/apollo_federation
    environment:
      # Port where Apollo Router listens inside container
      - PORT=3000
      # SERVICES is JSON array describing available GraphQL services
      - |
        SERVICES=
        [
          {"name": "gql_app", "url": "http://gql_app:8000/gql"}
        ]
    healthcheck:
      # Health check - test if container is healthy
      test: "curl -f -X GET http://localhost:3000/ || exit 1"
      interval: 60s
      retries: 3
      start_period: 60s
      timeout: 10s
    restart: on-failure:3 # No restart if container is "unhealthy", max 3 attempts
    ports:
      # External port 4001 to avoid conflict with gql_app on 4000 (so /api/gql works on 4000)
      - 4001:3000
    depends_on:
      gql_app:
        condition: service_started

  azure_proxy:
    build:
      context: .                    # potrebuje pristup k /src
      dockerfile: azure_proxy/Dockerfile
    environment:
        AZURE_COGNITIVE_ACCOUNT_NAME: ${AZURE_COGNITIVE_ACCOUNT_NAME}
        AZURE_OPENAI_API_KEY: ${OPENAI_API_KEY}
        AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: example
        POSTGRES_DB: data
        POSTGRES_HOST: postgres_gql:5432
    depends_on:
      postgres_gql:
        condition: service_healthy
    command: ["uvicorn", "azure_proxy.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./azure_proxy:/app/azure_proxy
      - ./src:/app/src
    ports:
      - 8798:8000

  postgres_gql:
    image: pgvector/pgvector:pg17
    environment:
      # promenne, ktere lze cist v kontejneru
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
      - POSTGRES_DB=data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 60s
      timeout: 10s
      retries: 5
    restart: on-failure:3 # nedojde k restartu pokud je kontejner "unhealthy", maximalne 3 pokusy
    volumes:
      # - dbdata:/var/lib/postgresql/data
      - ./pgvector:/docker-entrypoint-initdb.d    
    ports:
      - 5435:5432  # Changed from 5434 to avoid port conflict

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      # promenne, ktere lze cist v kontejneru
      - PGADMIN_DEFAULT_EMAIL=anoyne@anywhere.com
      - PGADMIN_DEFAULT_PASSWORD=example
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 60s
      timeout: 10s
      retries: 5
    ports:
      - 31800:80