[pytest]
# Pytest configuration for unit tests with code coverage
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --tb=line
    --showlocals
    --color=yes
    -ra
    -W ignore::DeprecationWarning
    -p no:warnings
    # Coverage options (can be overridden with --no-cov)
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-branch
    --cov-fail-under=65
markers =
    asyncio: marks tests as async (using pytest-asyncio)
    slow: marks tests as slow (deselect with '-m "not slow"')
    crud: marks tests as CRUD operations
    create: marks tests for CREATE operations
    read: marks tests for READ operations
    update: marks tests for UPDATE operations
    delete: marks tests for DELETE operations
    validation: marks tests for validation logic
    error_handling: marks tests for error handling
    filtering: marks tests for filtering functionality
    edge_cases: marks tests for edge cases
    endpoint_config: marks tests for EndpointConfig entity
    api_key: marks tests for ApiKey entity
    event: marks tests for Event entity
    user: marks tests for User entity
    document: marks tests for Document entity
    vector_filters: marks tests for vector filter functionality
    utilities: marks tests for utility functions
    rbac: marks tests for RBAC (Role-Based Access Control)
    permissions: marks tests for permission checking
filterwarnings =
    ignore::DeprecationWarning
    ignore:'pkgutil.find_loader' is deprecated:DeprecationWarning:vbuild
    ignore:Event driven styled extensions for on_request_start or on_request_end are deprecated, use on_operation instead:DeprecationWarning:strawberry\.extensions\.runner