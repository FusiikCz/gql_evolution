<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Endpoint Config CRUD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    textarea { font-family: monospace; }
    .small-label { font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h2>Endpoint Config CRUD</h2>
    <p class="text-muted">GraphQL endpoint: <code>/gql</code></p>

    <div class="mb-3">
      <button class="btn btn-primary" onclick="loadConfigs()">Refresh List</button>
    </div>

    <div class="table-responsive mb-4">
      <table class="table table-sm table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Type</th>
            <th>Base URL</th>
            <th>Active</th>
            <th>Lastchange</th>
          </tr>
        </thead>
        <tbody id="configRows"></tbody>
      </table>
    </div>

    <div class="row">
      <div class="col-md-4 mb-4">
        <h4>Create</h4>
        <label class="small-label">Name</label>
        <input id="createName" class="form-control mb-2" />
        <label class="small-label">Endpoint Type</label>
        <input id="createType" class="form-control mb-2" placeholder="openai_chat" />
        <label class="small-label">Base URL</label>
        <input id="createBaseUrl" class="form-control mb-2" placeholder="https://api.openai.com/v1" />
        <label class="small-label">Active</label>
        <select id="createActive" class="form-select mb-2">
          <option value="true">true</option>
          <option value="false">false</option>
        </select>
        <button class="btn btn-success" onclick="createConfig()">Create</button>
      </div>

      <div class="col-md-4 mb-4">
        <h4>Update</h4>
        <label class="small-label">ID</label>
        <input id="updateId" class="form-control mb-2" />
        <label class="small-label">Lastchange</label>
        <input id="updateLastchange" class="form-control mb-2" />
        <label class="small-label">Name</label>
        <input id="updateName" class="form-control mb-2" />
        <label class="small-label">Endpoint Type</label>
        <input id="updateType" class="form-control mb-2" />
        <label class="small-label">Base URL</label>
        <input id="updateBaseUrl" class="form-control mb-2" />
        <label class="small-label">Active</label>
        <select id="updateActive" class="form-select mb-2">
          <option value="">(no change)</option>
          <option value="true">true</option>
          <option value="false">false</option>
        </select>
        <button class="btn btn-warning" onclick="updateConfig()">Update</button>
      </div>

      <div class="col-md-4 mb-4">
        <h4>Delete</h4>
        <label class="small-label">ID</label>
        <input id="deleteId" class="form-control mb-2" />
        <button class="btn btn-danger" onclick="deleteConfig()">Delete</button>
      </div>
    </div>

    <div class="mt-4">
      <h5>Response</h5>
      <textarea id="response" class="form-control" rows="10" readonly></textarea>
    </div>
  </div>

  <script>
    const gql = async (query, variables = {}) => {
      const res = await fetch('/gql', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables })
      });
      return res.json();
    };

    const setResponse = (data) => {
      document.getElementById('response').value = JSON.stringify(data, null, 2);
    };

    const loadConfigs = async () => {
      const query = `
        query {
          result: endpointConfigPage {
            id
            name
            endpointType
            baseUrl
            isActive
            lastchange
          }
        }
      `;
      const data = await gql(query);
      setResponse(data);
      const rows = (data.data && data.data.result) || [];
      const tbody = document.getElementById('configRows');
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>${r.id || ''}</td>
          <td>${r.name || ''}</td>
          <td>${r.endpointType || ''}</td>
          <td>${r.baseUrl || ''}</td>
          <td>${r.isActive}</td>
          <td>${r.lastchange || ''}</td>
        </tr>
      `).join('');
    };

    const createConfig = async () => {
      const query = `
        mutation($input: EndpointConfigInsertGQLModel!) {
          result: endpointConfigInsert(endpointConfig: $input) {
            ... on EndpointConfigGQLModel { id name endpointType baseUrl isActive lastchange }
            ... on InsertError { msg failed code }
          }
        }
      `;
      const input = {
        name: document.getElementById('createName').value,
        endpointType: document.getElementById('createType').value,
        baseUrl: document.getElementById('createBaseUrl').value,
        isActive: document.getElementById('createActive').value === 'true'
      };
      const data = await gql(query, { input });
      setResponse(data);
      await loadConfigs();
    };

    const updateConfig = async () => {
      const query = `
        mutation($input: EndpointConfigUpdateGQLModel!) {
          result: endpointConfigUpdate(endpointConfig: $input) {
            ... on EndpointConfigGQLModel { id name endpointType baseUrl isActive lastchange }
            ... on EndpointConfigGQLModelUpdateError { msg failed }
          }
        }
      `;
      const isActiveValue = document.getElementById('updateActive').value;
      const input = {
        id: document.getElementById('updateId').value,
        lastchange: document.getElementById('updateLastchange').value,
        name: document.getElementById('updateName').value || null,
        endpointType: document.getElementById('updateType').value || null,
        baseUrl: document.getElementById('updateBaseUrl').value || null,
      };
      if (isActiveValue) {
        input.isActive = isActiveValue === 'true';
      }
      const data = await gql(query, { input });
      setResponse(data);
      await loadConfigs();
    };

    const deleteConfig = async () => {
      const query = `
        mutation($id: UUID!) {
          result: endpointConfigDelete(id: $id) {
            ... on EndpointConfigGQLModel { id name }
            ... on EndpointConfigGQLModelDeleteError { msg failed }
          }
        }
      `;
      const id = document.getElementById('deleteId').value;
      const data = await gql(query, { id });
      setResponse(data);
      await loadConfigs();
    };

    loadConfigs();
  </script>
</body>
</html>
