# ============================================
# KOMPLETNÍ CRUD WORKFLOW (CREATE → UPDATE → DELETE)
# ============================================
#
# Tento workflow ukazuje kompletní životní cyklus API klíče:
# 1. CREATE - Vytvoří nový klíč
# 2. UPDATE - Upraví klíč (použijte ID a lastchange z CREATE)
# 3. DELETE - Smaže klíč (použijte ID a lastchange z UPDATE)
#
# POSTUP:
# 1. Spusť CreateKeyCRUDWorkflow (KROK 1)
# 2. Zkopírujte ID a lastchange z odpovědi
# 3. Spusť UpdateKeyCRUDWorkflow s ID a lastchange z kroku 1 (KROK 2)
# 4. Zkopírujte nový lastchange z odpovědi
# 5. Spusť DeleteKeyCRUDWorkflow s ID a lastchange z kroku 2 (KROK 3)

# --- KROK 1: CREATE - Vytvoření nového API klíče ---
mutation CreateKeyCRUDWorkflow {
  apiKeyInsert(apiKey: {
    name: "CRUD Workflow Test Key"
    rateLimitPerMinute: 100
    rateLimitPerHour: 5000
    rateLimitPerDay: 100000
    maxTokensPerMonth: 1000000
    maxCostPerMonth: 100.0
    expiresAt: "2025-12-31T23:59:59Z"
  }) {
    ... on ApiKeyInsertResponse {
      plaintextKey                    # ⚠️ DŮLEŽITÉ: Ulož si tento klíč! Zobrazí se jen jednou!
      apiKey {
        id                            # ✅ ZKOPÍRUJ TOTO ID PRO KROK 2
        lastchange                    # ✅ ZKOPÍRUJ TOTO lastchange PRO KROK 2
        name
        prefix
        isActive
        rateLimitPerMinute
        rateLimitPerHour
        rateLimitPerDay
        maxTokensPerMonth
        maxCostPerMonth
        expiresAt
      }
    }
    ... on InsertError {
      msg
      code
    }
  }
}

# --- KROK 2: UPDATE - Aktualizace API klíče (použijte ID a lastchange z KROKU 1) ---
mutation UpdateKeyCRUDWorkflow($apiKeyInput: ApiKeyUpdateGQLModel!) {
  apiKeyUpdate(apiKey: $apiKeyInput) {
    ... on ApiKeyGQLModel {
      id                              # ✅ ZKOPÍRUJ TOTO ID PRO KROK 3
      lastchange                      # ✅ ZKOPÍRUJ TOTO lastchange PRO KROK 3
      name
      prefix
      isActive
      rateLimitPerMinute
      rateLimitPerHour
      rateLimitPerDay
      maxTokensPerMonth
      maxCostPerMonth
      expiresAt
    }
  }
}

# Variables example pro KROK 2 (použijte ID a lastchange z KROKU 1 - CreateKeyCRUDWorkflow):
# {
#   "apiKeyInput": {
#     "id": "PASTE_ID_FROM_STEP_1_HERE",           # ID z CreateKeyCRUDWorkflow odpovědi
#     "lastchange": "PASTE_LASTCHANGE_FROM_STEP_1_HERE",  # lastchange z CreateKeyCRUDWorkflow odpovědi
#     "name": "Updated CRUD Workflow Test Key",
#     "isActive": true,
#     "rateLimitPerMinute": 150,
#     "rateLimitPerHour": 6000,
#     "rateLimitPerDay": 120000,
#     "maxTokensPerMonth": 2000000,
#     "maxCostPerMonth": 200.0
#   }
# }

# --- KROK 3: DELETE - Smazání API klíče (použijte ID a lastchange z KROKU 2) ---
mutation DeleteKeyCRUDWorkflow($id: UUID!, $lastchange: DateTime!) {
  apiKeyDelete(apiKey: {
    id: $id
    lastchange: $lastchange
  })
}

# Variables example pro KROK 3 (použijte ID a lastchange z KROKU 2 - UpdateKeyCRUDWorkflow):
# {
#   "id": "PASTE_ID_FROM_STEP_2_HERE",           # ID z UpdateKeyCRUDWorkflow odpovědi
#   "lastchange": "PASTE_LASTCHANGE_FROM_STEP_2_HERE"  # lastchange z UpdateKeyCRUDWorkflow odpovědi
