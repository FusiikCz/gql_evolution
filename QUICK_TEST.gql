# ============================================
# GRAPHQL FRAGMENTS (Best Practice - reuse)
# ============================================

fragment ApiKeyFields on ApiKeyGQLModel {
  id
  name
  prefix
  isActive
  userId: user { id name email }
  createdAt: created
  expiresAt
  lastUsedAt
  rateLimitPerMinute
  rateLimitPerHour
  rateLimitPerDay
  maxTokensPerMonth
  maxCostPerMonth
  isExpired
  usageCount
  totalUsageThisMonth
  totalCostThisMonth
}

fragment UserFields on UserGQLModel {
  id
  name
  email
  is_active
  is_verified
  timezone
  max_api_keys
  displayName
  statusDescription
  createdAt: created
}

fragment EventFields on EventGQLModel {
  id
  name
  nameEn
  description
  startdate
  enddate
  place
  valid
  duration
  createdAt: created
}

fragment DocumentFields on DocumentGQLModel {
  id
  name
  nameEn
  description
  url
  createdAt: created
}

fragment EndpointConfigFields on EndpointConfigGQLModel {
  id
  name
  endpointType
  baseUrl
  modelMapping        # JSON string: {"gpt-4o": "gpt4o-prod", ...}
  defaultDeployment
  apiVersion
  sharedTokenHash  # Hashed token (read-only)
  tokenPrefix           # Token prefix for lookup (read-only)
  isActive
  description
  apiKeyId
  apiKey {                           # Related API key (if exists)
    id
    name
    prefix
  }
  createdAt: created
  lastchange
}

