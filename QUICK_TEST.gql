# --- Komplexní query: Uživatel s API klíči a usage ---
# POZNÁMKA: apiKeys field neexistuje - použij samostatnou query apiKeyPage s filtrem userId místo toho
query GetUserWithKeysAndUsage($userId: UUID!) {
  userById(id: $userId) {
    ...UserFields
    # apiKeys field neexistuje - použij samostatnou query apiKeyPage s filtrem userId místo toho
  }
}

# --- Komplexní query: Event s pozvánkami ---
query GetEventWithInvitations($eventId: UUID!) {
  eventById(id: $eventId) {
    ...EventFields
    userInvitations {
      id
      user {
        ...UserFields
      }
      stateId
    }
  }
}

# --- Komplexní query: Dokument s fragmenty ---
query GetDocumentWithFragments($documentId: UUID!) {
  documentById(id: $documentId) {
    ...DocumentFields
    fragments {
      id
      title
      summary
      content
      orderIndex
    }
  }
}

