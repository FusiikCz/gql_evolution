# 1. Vždy používej variables pro mutations (lepší pro testování)
# 2. Zkopíruj ID a lastchange z READ queries pro UPDATE/DELETE
# 3. Používej fragments pro opakující se field selections
# 4. Optimistic locking: vždy zahrni lastchange při UPDATE/DELETE
# 5. Error handling: vždy zahrni error fragments (InsertError, UpdateError, DeleteError)
# 6. Pro production: použij GraphQL variables místo inline hodnot
