# ============================================
# GraphQL API Test Queries & Mutations
# Task 11: API Key Management System
# ============================================
#
# POSTUP PRO PREZENTACI:
# 1. CREATE - Spusť CreateKeyWithLimits (vytvoří klíč s limitami)
# 2. READ   - Spusť GetAllKeys (zobrazí všechny klíče, zkopíruj ID a lastchange)
# 3. UPDATE - Spusť UpdateKey (uprav hodnoty podle potřeby, použij ID a lastchange z kroku 2)
# 4. DELETE - Spusť DeleteKey (smaže klíč podle ID z kroku 2)
#
# ============================================

# ============================================
# GRAPHQL FRAGMENTS (Best Practice - reuse)
# ============================================

fragment BaseFields on BaseGQLModel {
  id
  created
  lastchange
}

fragment ApiKeyFields on ApiKeyGQLModel {
  id
  name
  prefix
  isActive
  userId: user { id name email }
  createdAt: created
  expiresAt
  lastUsedAt
  rateLimitPerMinute
  rateLimitPerHour
  rateLimitPerDay
  maxTokensPerMonth
  maxCostPerMonth
  isExpired
  usageCount
  totalUsageThisMonth
  totalCostThisMonth
}

fragment UserFields on UserGQLModel {
  id
  name
  email
  isActive: is_active
  isVerified: is_verified
  timezone
  maxApiKeys: max_api_keys
  displayName: display_name
  statusDescription: status_description
  createdAt: created
}

fragment EventFields on EventGQLModel {
  id
  name
  nameEn: name_en
  description
  startdate
  enddate
  place
  valid
  duration
  createdAt: created
}

fragment DocumentFields on DocumentGQLModel {
  id
  name
  nameEn: name_en
  description
  url
  createdAt: created
}

# ============================================
# SECTION 1: API KEY OPERATIONS
# ============================================

# --- CREATE: Základní vytvoření klíče ---
mutation CreateKey {
  apiKeyInsert(apiKey: { name: "My Test Key" }) {
    ... on ApiKeyInsertResponse {
      plaintextKey                    # ⚠️ DŮLEŽITÉ: Ulož si tento klíč! Zobrazí se jen jednou!
      apiKey {
        ...ApiKeyFields
      }
    }
    ... on InsertError {
      msg
      code
    }
  }
}

# --- CREATE: Kompletní test s rate limiting ---
mutation CreateKeyWithLimits {
  apiKeyInsert(apiKey: { 
    name: "Production Key"
    rateLimitPerMinute: 100
    rateLimitPerHour: 5000
    rateLimitPerDay: 100000
    maxTokensPerMonth: 1000000
    maxCostPerMonth: 100.0
    expiresAt: "2025-12-31T23:59:59Z"
  }) {
    ... on ApiKeyInsertResponse {
      plaintextKey                    # ⚠️ DŮLEŽITÉ: Ulož si tento klíč! Zobrazí se jen jednou!
      apiKey {
        ...ApiKeyFields
      }
    }
    ... on InsertError {
      msg
      code
    }
  }
}

# --- READ: Získání seznamu všech klíčů ---
query GetAllKeys {
  apiKeyPage {
    ...ApiKeyFields
  }
}

# --- READ: Vlastní klíče uživatele ---
query MyApiKeys {
  myApiKeys {
    ...ApiKeyFields
  }
}

# --- READ: Expirované klíče ---
query ExpiredApiKeys {
  expiredApiKeys {
    ...ApiKeyFields
  }
}

# --- READ: Klíč podle ID ---
query GetApiKeyById($id: ID!) {
  apiKeyById(id: $id) {
    ...ApiKeyFields
    user {
      ...UserFields
    }
    usage {
      id
      ts
      totalTokens
      costUsd
      route
      deployment
    }
  }
}

# --- UPDATE: S variables (doporučený způsob) ---
mutation UpdateKey($apiKeyInput: ApiKeyUpdateGQLModel!) {
  apiKeyUpdate(apiKey: $apiKeyInput) {
    ... on ApiKeyGQLModel {
      ...ApiKeyFields
    }
    ... on UpdateError {
      msg
      code
    }
  }
}

# Variables example:
# {
#   "apiKeyInput": {
#     "id": "c2436db6-8773-4d88-99a5-779ad85fa255",
#     "lastchange": "2025-11-03T08:03:03.128789",
#     "name": "Updated Production Key",
#     "isActive": true,
#     "rateLimitPerMinute": 200
#   }
# }

# --- DEACTIVATE: Soft delete ---
mutation DeactivateKey($apiKeyInput: ApiKeyUpdateGQLModel!) {
  apiKeyDeactivate(apiKey: $apiKeyInput) {
    ... on ApiKeyGQLModel {
      ...ApiKeyFields
    }
    ... on UpdateError {
      msg
      code
    }
  }
}

# --- REGENERATE: Vygeneruje nový prefix a hash ---
mutation RegenerateKey($apiKeyInput: ApiKeyUpdateGQLModel!) {
  apiKeyRegenerate(apiKey: $apiKeyInput) {
    ... on ApiKeyGQLModel {
      ...ApiKeyFields
    }
    ... on UpdateError {
      msg
      code
    }
  }
}

# --- DELETE: Smazání klíče ---
mutation DeleteKey($id: ID!, $lastchange: DateTime!) {
  apiKeyDelete(apiKey: {
    id: $id
    lastchange: $lastchange
  }) {
    ... on DeleteError {
      msg
      code
    }
  }
}

