# --- READ: Seznam pozvánek ---
query GetAllInvitations {
  eventInvitationPage(skip: 0, limit: 50) {
    id
    event {
      ...EventFields
    }
    user {
      ...UserFields
    }
    stateId: state_id
    createdAt: created
  }
}

# --- CREATE: Vytvoření pozvánky ---
mutation CreateInvitation {
  eventInvitationInsert(invitation: {
    eventId: "PASTE_EVENT_ID_HERE"
    userId: "PASTE_USER_ID_HERE"
    stateId: "01b96c1d-8389-4267-a859-d8116e1c32f3"  # 'invited'
  }) {
    ... on EventInvitationGQLModel {
      id
      event {
        ...EventFields
      }
      user {
        ...UserFields
      }
      stateId: state_id
    }
    ... on InsertError {
      msg
      code
    }
  }
}

# --- UPDATE: Přijetí/odmítnutí pozvánky ---
mutation AcceptDeclineInvitation($invitationInput: EventInvitationUpdateGQLModel!) {
  eventInvitationAcceptDecline(invitation: $invitationInput) {
    ... on EventInvitationGQLModel {
      id
      stateId: state_id
      event {
        ...EventFields
      }
      user {
        ...UserFields
      }
    }
    ... on UpdateError {
      msg
      code
    }
  }
}

