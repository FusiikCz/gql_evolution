# --- DELETE: Smazání endpoint konfigurace ---
# POZNÁMKA: Delete mutace vrací Optional[DeleteError], takže při úspěchu vrací null
mutation DeleteEndpointConfig($id: UUID!) {
  endpointConfigDelete(id: $id)
}

