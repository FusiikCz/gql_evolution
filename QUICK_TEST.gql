# --- READ: Usage statistiky ---
query GetUsageStats($apiKeyId: ID!) {
  apiKeyById(id: $apiKeyId) {
    id
    name
    totalUsageThisMonth
    totalCostThisMonth
    usageCount
    usage {
      id
      ts
      route
      deployment
      totalTokens
      costUsd
      status
    }
  }
}

# --- READ: Usage page s filtrováním ---
query GetUsagePage {
  usagePage(skip: 0, limit: 50) {
    id
    ts
    apiKey {
      id
      name
      prefix
    }
    route
    deployment
    model
    totalTokens
    costUsd
    status
  }
}

# --- READ: Usage podle ID ---
query GetUsageById($id: ID!) {
  usageById(id: $id) {
    id
    ts
    apiKey {
      ...ApiKeyFields
    }
    route
    deployment
    model
    promptTokens
    completionTokens
    totalTokens
    costUsd
    status
  }
}

