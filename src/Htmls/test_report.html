<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h2>Test Report</h2>
    <p class="text-muted">Source: <code>/test-report.json</code></p>
    <pre id="report" class="bg-light p-3 border rounded" style="min-height: 200px;"></pre>
  </div>

  <script>
    const target = document.getElementById('report');
    fetch('/test-report.json')
      .then(r => r.json())
      .then(data => {
        target.textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        target.textContent = 'No report found. Run: python tests/run_test.py <test_name> --report';
      });
  </script>
</body>
</html>
